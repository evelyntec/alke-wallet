{% extends "base.html" %}
{% block titulo %}Eliminar {{ tipo_objeto }}{% endblock %}
{% block contenido %}
<section class="panel panel--angosto">
  <h1>¿Eliminar {{ tipo_objeto }}?</h1>
  <p class="destacado">{{ object }}</p>
  {% if aviso %}<p class="aviso aviso--warning">{{ aviso }}</p>{% endif %}
  <p class="texto-suave">Esta acción no se puede deshacer.</p>
  <form method="post" class="acciones">
    {% csrf_token %}
    <button type="submit" class="boton boton--peligro">Sí, eliminar</button>
    <a class="boton boton--suave" href="{{ object.get_absolute_url }}">Cancelar</a>
  </form>
</section>
{% endblock %}
